<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101512">
  <title>Audio Player</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101512;
      --panel: #191f1b;
      --panel-soft: #202823;
      --text: #edf1eb;
      --muted: #9aa69b;
      --line: #303a33;
      --accent: #b5ef83;
      --accent-dark: #1c2a18;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: radial-gradient(ellipse at 50% 0%, #26342a 0%, var(--bg) 58%);
      color: var(--text);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    .player { width: min(100%, 620px); }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.05; letter-spacing: -.055em; }
    .intro { margin: 12px 0 24px; color: var(--muted); }
    .card {
      padding: clamp(20px, 5vw, 32px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 24px 80px #0005;
    }
    .dropzone {
      display: grid;
      min-height: 160px;
      place-items: center;
      padding: 20px;
      border: 1px dashed #566255;
      border-radius: 16px;
      background: #ffffff04;
      text-align: center;
      transition: border-color .15s, background .15s;
    }
    .dropzone.dragging { border-color: var(--accent); background: #b5ef8310; }
    .upload-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 13px;
      background: var(--accent-dark);
      color: var(--accent);
      font-size: 1.35rem;
    }
    .drop-title { margin: 0; font-weight: 700; }
    .drop-hint { margin: 4px 0 12px; color: var(--muted); font-size: .9rem; }
    .file-button, .control-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel-soft);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
      transition: transform .12s, border-color .12s, background .12s;
    }
    .file-button:hover, .control-button:hover { border-color: #627363; background: #29342c; }
    button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible, select:focus-visible, .file-button:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
    #fileInput { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
    .track { margin-top: 24px; }
    .track-name { margin: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .track-name.loaded { color: var(--text); font-weight: 650; }
    .timeline { margin-top: 12px; }
    .time-row { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .82rem; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    #seek { display: block; margin: 7px 0 0; }
    .transport { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px 0 24px; }
    .control-button { min-width: 72px; }
    .control-button .icon { font-size: 1rem; }
    .play-button {
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #162012;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 25px #b5ef8328;
    }
    .options { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
    .option { display: flex; align-items: center; gap: 11px; }
    .option label { color: var(--muted); font-size: .9rem; }
    select {
      min-height: 40px;
      padding: 0 32px 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
    }
    .skip-setting { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: .9rem; }
    .skip-setting input { width: 54px; padding: 8px 5px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-soft); color: var(--text); text-align: center; }
    .keyboard-hint { margin: 18px 0 0; color: #7e8a80; font-size: .78rem; text-align: center; }
    .keyboard-hint kbd { padding: 2px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: #c3ccc1; font: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      .card { border-radius: 19px; }
      .options { align-items: flex-start; flex-direction: column; gap: 14px; }
      .control-button { min-width: 66px; padding: 0 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="player">
    <p class="eyebrow">A quiet place to listen</p>
    <h1>Audio Player</h1>
    <p class="intro">Your file stays on this device. Pick a track and listen at your own pace.</p>

    <section class="card" aria-label="Audio player">
      <div class="dropzone" id="dropzone">
        <div>
          <div class="upload-icon" aria-hidden="true">♫</div>
          <p class="drop-title">Drop an MP3 here</p>
          <p class="drop-hint">or choose a file from your device</p>
          <label class="file-button" for="fileInput">Choose MP3</label>
          <input id="fileInput" type="file" accept="audio/mpeg,.mp3,audio/*" aria-label="Choose an audio file">
        </div>
      </div>

      <div class="track">
        <p class="track-name" id="trackName" aria-live="polite">No track selected</p>
        <div class="timeline">
          <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
          <label class="sr-only" for="seek">Seek through audio</label>
          <input id="seek" type="range" min="0" max="1000" value="0" disabled>
        </div>
      </div>

      <div class="transport" aria-label="Playback controls">
        <button class="control-button" id="backButton" type="button" aria-label="Go back 10 seconds" title="Back 10 seconds"><span class="icon" aria-hidden="true">↶</span> <span id="backLabel">10s</span></button>
        <button class="play-button" id="playButton" type="button" aria-label="Play" title="Play" disabled>▶</button>
        <button class="control-button" id="forwardButton" type="button" aria-label="Go forward 10 seconds" title="Forward 10 seconds"><span id="forwardLabel">10s</span> <span class="icon" aria-hidden="true">↷</span></button>
      </div>

      <div class="options">
        <div class="option">
          <label for="speed">Playback speed</label>
          <select id="speed" aria-label="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </div>
        <div class="skip-setting">
          <label for="skipSeconds">Skip</label>
          <input id="skipSeconds" type="number" min="1" max="300" step="1" value="10" inputmode="numeric" aria-label="Skip interval in seconds">
          <span>seconds</span>
        </div>
      </div>
      <p class="keyboard-hint"><kbd>Space</kbd> play or pause · <kbd>←</kbd>/<kbd>→</kbd> skip</p>
    </section>
    <audio id="audio" preload="metadata"></audio>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const audio = document.querySelector('#audio');
      const fileInput = document.querySelector('#fileInput');
      const dropzone = document.querySelector('#dropzone');
      const trackName = document.querySelector('#trackName');
      const playButton = document.querySelector('#playButton');
      const seek = document.querySelector('#seek');
      const currentTime = document.querySelector('#currentTime');
      const duration = document.querySelector('#duration');
      const speed = document.querySelector('#speed');
      const skipSeconds = document.querySelector('#skipSeconds');
      const status = document.querySelector('#status');
      let objectUrl = null;
      let wasPlayingBeforeSeek = false;

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const whole = Math.floor(seconds);
        const hours = Math.floor(whole / 3600);
        const minutes = Math.floor((whole % 3600) / 60);
        const remainder = String(whole % 60).padStart(2, '0');
        return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${remainder}` : `${minutes}:${remainder}`;
      };

      const getSkip = () => {
        const value = Number.parseInt(skipSeconds.value, 10);
        return Number.isFinite(value) ? Math.min(300, Math.max(1, value)) : 10;
      };

      const updateSkipLabels = () => {
        const value = getSkip();
        document.querySelector('#backLabel').textContent = `${value}s`;
        document.querySelector('#forwardLabel').textContent = `${value}s`;
        document.querySelector('#backButton').setAttribute('aria-label', `Go back ${value} seconds`);
        document.querySelector('#forwardButton').setAttribute('aria-label', `Go forward ${value} seconds`);
      };

      const loadFile = (file) => {
        if (!file) return;
        if (!(file.type.startsWith('audio/') || /\.mp3$/i.test(file.name))) {
          status.textContent = 'Please choose an audio file.';
          return;
        }
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(file);
        audio.src = objectUrl;
        audio.load();
        trackName.textContent = file.name;
        trackName.classList.add('loaded');
        currentTime.textContent = '0:00';
        duration.textContent = '0:00';
        seek.value = 0;
        seek.disabled = false;
        playButton.disabled = false;
        playButton.textContent = '▶';
        playButton.setAttribute('aria-label', 'Play');
        status.textContent = `Loaded ${file.name}`;
      };

      const togglePlayback = async () => {
        if (!audio.src) return;
        if (audio.paused) {
          try { await audio.play(); }
          catch { status.textContent = 'Playback could not start. Try pressing play again.'; }
        } else audio.pause();
      };

      const skip = (direction) => {
        if (!audio.src) return;
        const next = Math.max(0, Math.min(audio.duration || Infinity, audio.currentTime + direction * getSkip()));
        audio.currentTime = next;
      };

      fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));
      document.querySelector('#playButton').addEventListener('click', togglePlayback);
      document.querySelector('#backButton').addEventListener('click', () => skip(-1));
      document.querySelector('#forwardButton').addEventListener('click', () => skip(1));
      skipSeconds.addEventListener('input', updateSkipLabels);
      skipSeconds.addEventListener('change', () => { skipSeconds.value = getSkip(); updateSkipLabels(); });
      speed.addEventListener('change', () => { audio.playbackRate = Number(speed.value); });

      audio.addEventListener('loadedmetadata', () => {
        duration.textContent = formatTime(audio.duration);
        seek.max = Math.max(1, Math.floor(audio.duration * 10));
      });
      audio.addEventListener('timeupdate', () => {
        currentTime.textContent = formatTime(audio.currentTime);
        if (!seek.matches(':active')) seek.value = Math.floor(audio.currentTime * 10);
      });
      audio.addEventListener('play', () => {
        playButton.textContent = 'Ⅱ';
        playButton.setAttribute('aria-label', 'Pause');
        status.textContent = 'Playing';
      });
      audio.addEventListener('pause', () => {
        playButton.textContent = '▶';
        playButton.setAttribute('aria-label', 'Play');
        status.textContent = 'Paused';
      });
      audio.addEventListener('ended', () => {
        playButton.textContent = '▶';
        playButton.setAttribute('aria-label', 'Play');
        status.textContent = 'Finished playing';
      });
      seek.addEventListener('pointerdown', () => { wasPlayingBeforeSeek = !audio.paused; });
      seek.addEventListener('input', () => {
        if (Number.isFinite(audio.duration)) {
          audio.currentTime = Number(seek.value) / 10;
          currentTime.textContent = formatTime(audio.currentTime);
        }
      });
      seek.addEventListener('pointerup', () => {
        if (wasPlayingBeforeSeek && audio.paused) audio.play();
      });

      for (const eventName of ['dragenter', 'dragover']) {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.add('dragging');
        });
      }
      for (const eventName of ['dragleave', 'drop']) {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.remove('dragging');
        });
      }
      dropzone.addEventListener('drop', (event) => loadFile(event.dataTransfer.files[0]));

      document.addEventListener('keydown', (event) => {
        const target = event.target;
        const typing = target instanceof HTMLElement && (target.isContentEditable || ['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(target.tagName));
        if (typing || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.code === 'Space') { event.preventDefault(); togglePlayback(); }
        if (event.code === 'ArrowLeft') { event.preventDefault(); skip(-1); }
        if (event.code === 'ArrowRight') { event.preventDefault(); skip(1); }
      });

      window.addEventListener('beforeunload', () => {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
      });
      updateSkipLabels();
    })();
  </script>
</body>
</html>
